<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f1a" />
    <title>Questbound</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./assets/ui/favicon-32.png" />
    <link rel="apple-touch-icon" href="./assets/ui/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Questbound" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <div id="error-area"></div>
      <button class="update-banner" id="update-banner" type="button" hidden>Update ready &mdash; tap to reload</button>

      <section class="screen" id="boot-screen">
        <p class="boot-text">Loading&hellip;</p>
      </section>

      <section class="screen" id="title-screen" hidden>
        <header class="title-header">
          <h1 class="game-title is-large">Questbound</h1>
          <p class="title-tagline">Choose a save slot</p>
        </header>
        <p class="title-message" id="title-message" hidden></p>
        <div class="slot-list" id="slot-list"></div>
        <div class="title-extras">
          <button class="text-button" id="title-settings" type="button" aria-expanded="false">Settings</button>
          <button class="text-button" id="title-credits" type="button" aria-expanded="false">Credits</button>
        </div>
        <div id="title-settings-panel"></div>
        <div id="title-credits-panel"></div>
      </section>

      <section class="screen" id="creation-screen" hidden>
        <header class="title-bar">
          <h1 class="game-title">New hero</h1>
          <nav class="title-bar-links" aria-label="Creation menu">
            <span class="title-bar-note" id="creation-slot"></span>
            <button class="text-button" id="creation-cancel" type="button">Save slots</button>
          </nav>
        </header>
        <div id="creation-confirm"></div>
        <p class="creation-progress" id="creation-progress"></p>
        <main class="creation-body" id="creation-body"></main>
        <div class="creation-footer" id="creation-footer">
          <p class="creation-needs" id="creation-needs" aria-live="polite"></p>
          <div class="creation-nav">
            <button class="slot-button" id="creation-back" type="button">Back</button>
            <button class="slot-button is-primary" id="creation-next" type="button">Next</button>
          </div>
        </div>
      </section>

      <section class="screen" id="adventure-screen" hidden>
        <header class="title-bar">
          <h1 class="game-title">Questbound</h1>
          <span class="title-bar-note" id="save-status"></span>
        </header>
        <p class="status-line" id="play-status"></p>

        <!-- One tab shows at a time; the bottom bar switches between them. -->
        <div class="play-tab" id="tab-adventure">
          <p class="hero-strip" id="hero-strip"></p>
          <div class="adventure-tools">
            <button class="slot-button what-now-button" id="what-now" type="button" aria-expanded="false">What now?</button>
          </div>

          <div class="notices" id="notices"></div>

          <main class="dm-window" id="narration" aria-live="polite"></main>

          <!-- The dungeon map, while the hero is in a dungeon (not during a fight). -->
          <div id="map-area"></div>

          <div id="battle-area"></div>

          <nav class="choices" id="choices" aria-label="Choices"></nav>

          <details class="roll-log-drawer">
            <summary>Roll log (<span id="roll-count">0</span>)</summary>
            <ol class="roll-log" id="roll-log"></ol>
          </details>
        </div>
        <div class="play-tab" id="tab-sheet" hidden></div>
        <div class="play-tab" id="tab-journal" hidden></div>
        <div class="play-tab" id="tab-menu" hidden>
          <p class="menu-slot" id="slot-note"></p>
          <div class="menu-actions">
            <button class="slot-button is-primary" id="end-session" type="button">End session</button>
            <button class="slot-button" id="to-title" type="button">Save slots</button>
            <button class="slot-button" id="play-credits" type="button" aria-expanded="false">Credits</button>
          </div>
          <div id="menu-credits"></div>
          <div id="menu-settings"></div>
        </div>

        <nav class="bottom-nav" id="bottom-nav" aria-label="Game sections">
          <button class="bottom-tab" type="button" data-tab="adventure" aria-current="page">Adventure</button>
          <button class="bottom-tab" type="button" data-tab="sheet">Sheet</button>
          <button class="bottom-tab" type="button" data-tab="journal">Journal</button>
          <button class="bottom-tab" type="button" data-tab="menu">Menu</button>
        </nav>
      </section>

      <footer class="footer" id="debug-footer" hidden>
        <span>Debug mode</span>
        <a href="./tests/rules.html">Tests</a>
      </footer>

      <button class="debug-toggle" id="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="false" hidden>Debug</button>
      <aside class="debug-panel" id="debug-panel" aria-label="Debug tools" hidden></aside>
    </div>
  </body>
</html>
